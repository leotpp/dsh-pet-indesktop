name: Build macOS App

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
    inputs:
      source_ref:
        description: '要构建的 ref/SHA（留空 = 本 workflow 的触发 ref，即默认检出）'
        required: false
        type: string
        default: ''
      upload_artifacts:
        description: '把产物上传为 Actions artifact（tag 推送始终上传；手动默认否）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'                # 打 tag 时自动触发并发布 Release

permissions:
  contents: write           # 用于创建 Release 上传产物

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon（arm64）；Intel 用户请用源码运行
    # 编码隔离（issue #26）：强制 UTF-8 模式，避免任何环节按 legacy 编码
    # 二次解码中文源码/资源（PYTHONIOENCODING 只解决控制台输出）。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动构建用 source_ref 指定要构建的树（三端对齐同一提交）；留空即回落
          # github.sha（= 事件默认检出的提交，tag 推送时就是该 tag 指向的提交）。
          ref: ${{ github.event.inputs.source_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      # 记录「这次构建的是哪棵树 + 到底装了什么」：三端 artifact 能不能对上要看
      # SHA；而 requirements.txt 全是 `>=` 无上限、无 lock，三端各自解析最新
      # 兼容版（imageio-ffmpeg 每平台还是不同的 ffmpeg 构建）。
      - name: Record resolved source SHA and toolchain
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          NODE_VERSION="$(node --version)"
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"
          {
            echo "### ${{ runner.os }} 构建输入"
            echo ""
            echo "- event: ${{ github.event_name }}"
            echo "- ref: ${{ github.ref }}"
            echo "- github.sha: ${{ github.sha }}"
            echo "- checkout HEAD: $HEAD_SHA"
            echo "- python: $(python --version 2>&1)"
            echo "- node: $NODE_VERSION"
            echo ""
            echo "<details><summary>pip freeze</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/pip-freeze.txt"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # GIF 变体（gif-chat / gif）不再发布：包体约 800 MB×2、上传与下载
      # 成本过高，v4.0.0 起停供。确有需要的用户请按 README「打包发布」
      # 一节自行构建（先运行 scripts/convert_to_gif.py 生成素材）。
      # 命令与 PR 门禁（pr-test.yml）保持同一套：时序 flake 家族从主套件里
      # 隔离成独立步骤——webm 生命周期族的 reader/ffmpeg teardown 竞态在 macOS
      # CI 上偶发段错误（exit 139，栈在 reader 线程 + imageio LogCatcher），
      # 段错误会杀掉整个 pytest 进程、拖垮主套件的结果报告。隔离不掩盖失败：
      # 每一族照常判红，只额外给一次重跑机会（与门禁一致）。
      - name: Pytest (main suite)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py
        # 三文件同进程在 macOS 确定性段错误（见 pr-test.yml 同款注释）：拆独立进程照跑
      - name: Pytest (webm lifecycle family, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py || python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      - name: Pytest (low-priority warm family, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q tests/test_low_priority_warm_interaction_yield.py

      # frameseq 原生崩溃隔离位：肇事者系 test_frameseq_clip.py 单条用例
      # （verbose 复现钉死；watchdog 族系位置误判已排除，回归主套件）。
      # 详见 pr-test.yml 同名单元注释，按族先例隔离 + 一次重跑。
      - name: Pytest (frameseq native-crash isolates, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero || python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero

      # 帧序列素材供给（三端同一口径，2026-10-11）：frameseq/ 是刻意不入库的派生
      # 产物（.gitignore），干净检出里必然没有；构建对素材整树拷贝
      # assets/characters，缺了也不报错——不补这一步就会打出缺素材的静默降级包。
      # 缓存 key 由脚本按「源 webm 摘要 + 转换器/供给实现 + 编码档 + 平台/Python/
      # Pillow/imageio-ffmpeg 版本」算出：命中即近零成本，未命中才重转 106 段
      # （冷缓存约 28 min）。缓存里是本仓库公开源素材的派生物，不含任何 secret，
      # 且缓存只是构建期缓存、不是发布产物。
      # 本 fork 的 macOS 安装包保留完整动作；缓存 key 覆盖全部源素材。
      # random/events 必须一起准备，避免动作菜单和随机播放随打包丢失。

      - name: Compute frameseq cache key
        id: frameseq-cache
        shell: bash
        run: echo "key=$(python scripts/prepare_frameseq_bundle.py --print-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore frameseq material cache
        uses: actions/cache@v4
        with:
          path: assets/characters/*/frameseq
          key: ${{ steps.frameseq-cache.outputs.key }}

      # 先验完整（命中即跳过转换）→ 缺才转 → 转完再验；坏缓存不会被盲跳过，
      # 命令的真实退出码原样冒泡。两个变体共用这一次素材准备，不重复转。
      - name: Prepare frameseq material
        shell: bash
        run: python scripts/prepare_frameseq_bundle.py --character shenshen --include random,events

      # 构建入口与本地完全一致：scripts/build_macos.sh（PyInstaller 打包 +
      # 中文编码自检 + ad-hoc 签名都在脚本内完成），CI 不内联
      # 任何构建命令，避免本地/CI 两套逻辑漂移。
      # 只构建两个 webm 变体（与 Windows/Linux 发布一致）。
      - name: Build onedir .app variants
        run: |
          bash scripts/build_macos.sh \
            --dist dist \
            --variants webm-chat,webm

      - name: Verify pet module collected
        run: |
          for VARIANT in webm-chat webm; do
            APP="dsh-pet-standalone-$VARIANT"
            WARN="$(find build -name "warn-$APP.txt" | head -1)"
            if [ -n "$WARN" ] && grep -q "missing module named pet" "$WARN"; then
              echo "::error::$APP pet 模块未被 PyInstaller 收集"; cat "$WARN"; exit 1
            fi
            echo "$APP pet 模块已收集"
            if ! find dist -path "*integrations/dsh-pet-bridge/package.json" | grep -q .; then
              echo "::error::$APP 未打包 integrations/dsh-pet-bridge，DSH 桥接一键安装必然失败"; exit 1
            fi
            echo "$APP 桥接插件资源已打包"
          done

      - name: Package as zip
        run: |
          cd dist
          for VARIANT in webm-chat webm; do
            ditto -c -k --keepParent "dsh-pet-standalone-$VARIANT.app" \
              "dsh-pet-standalone-$VARIANT-macos-arm64.zip"
          done

      - name: Verify zip preserves executable permission
        run: |
          for ZIP in dist/dsh-pet-standalone-*-macos-arm64.zip; do
            rm -rf /tmp/verify && mkdir -p /tmp/verify
            cd /tmp/verify
            unzip -q "$GITHUB_WORKSPACE/$ZIP"
            APP="${ZIP##*/}"; APP="${APP%-macos-arm64.zip}.app"
            BIN="$APP/Contents/MacOS/${APP%.app}"
            ls -l "$BIN"
            if [ ! -x "$BIN" ]; then
              echo "::error::$ZIP 解压后二进制丢失可执行权限"; exit 1
            fi
            echo "$ZIP 可执行权限保留"
            cd "$GITHUB_WORKSPACE"
          done

      # 产物默认不上传：手动 dispatch 是验证用途，往公共仓库 Actions 堆大产物
      # 没有收益（也就把刻意不入库的素材树带上去了）。tag 推送照旧上传，
      # 手动要上传必须显式打开 upload_artifacts——即使把运行 ref 选到某个已有
      # tag 上手动跑也一样（github.ref 在那里同样带 refs/tags/ 前缀，所以条件
      # 必须先要求 event_name == 'push'，不能只看 ref 前缀）。
      - name: Upload artifact
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-standalone-macos-arm64
          path: dist/*.zip
          retention-days: 30

      # 只有 tag 推送才发布 Release：手动 dispatch 是验证用途，即使把 ref 指到
      # 某个 tag 上手动跑，也不许创建/改写 Release。
      - name: Publish Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          # 草稿：构建完只挂附件，发布由维护者核对后手动 publish；
          # generate_release_notes 必须关——否则会覆盖维护者写的发布正文。
          draft: true
          generate_release_notes: false
